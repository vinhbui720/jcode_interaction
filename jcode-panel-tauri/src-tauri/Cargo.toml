[package]
name = "jcode-panel-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = "1"
shell-words = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
x11rb = "0.13"
toml = "0.8"
