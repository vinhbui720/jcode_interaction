[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jcode-panel"
version = "0.1.0"
description = "Minimal Ubuntu panel client for jcode"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pynput>=1.7", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jcode-panel = "jcode_panel.main:main"
jcp = "jcode_panel.main:prompt_main"

[tool.setuptools]
packages = ["jcode_panel"]
